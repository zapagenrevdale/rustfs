# Throwaway fork-only lane: verifies fix/presigned-query-metadata on a
# GitHub-hosted runner, since ci.yml's compile lanes need self-hosted runners.
name: Verify presigned query metadata

on:
  push:
    branches: [ ci/verify-presigned-meta ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'

      - name: Format
        run: cargo fmt --all --check

      - name: Build server
        run: |
          cargo build --locked -p rustfs --bin rustfs
          df -h /

      - name: Presigned PUT keeps x-amz-meta-* end to end
        env:
          RUSTFS_ACCESS_KEY: verify-access
          RUSTFS_SECRET_KEY: verify-secret-key
          RUSTFS_ADDRESS: 127.0.0.1:9000
          RUSTFS_CONSOLE_ENABLE: "false"
          RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
        run: |
          mkdir -p "$RUNNER_TEMP/vol"
          RUSTFS_VOLUMES="$RUNNER_TEMP/vol" ./target/debug/rustfs > "$RUNNER_TEMP/rustfs.log" 2>&1 &
          for _ in $(seq 60); do curl -sf -o /dev/null http://127.0.0.1:9000/health/ready && break; sleep 1; done
          mkdir -p "$RUNNER_TEMP/js" && cd "$RUNNER_TEMP/js"
          npm init -y > /dev/null
          npm install --silent @aws-sdk/client-s3 @aws-sdk/s3-request-presigner
          cat > verify.mjs <<'JS'
          import { S3Client, CreateBucketCommand, PutObjectCommand, HeadObjectCommand } from "@aws-sdk/client-s3";
          import { getSignedUrl } from "@aws-sdk/s3-request-presigner";
          import assert from "node:assert/strict";
          const s3 = new S3Client({ endpoint: "http://127.0.0.1:9000", region: "us-east-1", forcePathStyle: true,
            credentials: { accessKeyId: "verify-access", secretAccessKey: "verify-secret-key" } });
          await s3.send(new CreateBucketCommand({ Bucket: "verify" }));
          const metadata = { "user-id": "u1", "file-name": "a b.csv" };
          const url = await getSignedUrl(s3, new PutObjectCommand({ Bucket: "verify", Key: "a.csv", Metadata: metadata }), { expiresIn: 300 });
          const hoisted = [...new URL(url).searchParams.keys()].filter((k) => k.toLowerCase().startsWith("x-amz-meta-")).sort();
          console.log("metadata carried in query:", hoisted);
          assert.ok(hoisted.length > 0, "SDK did not hoist metadata into the query");
          const put = await fetch(url, { method: "PUT", body: "x,y\n" });
          console.log("presigned PUT status:", put.status);
          assert.equal(put.status, 200, await put.text());
          const head = await s3.send(new HeadObjectCommand({ Bucket: "verify", Key: "a.csv" }));
          console.log("stored metadata:", head.Metadata);
          assert.deepEqual(head.Metadata, metadata);
          JS
          node verify.mjs

      - name: Server log on failure
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/rustfs.log" || true
